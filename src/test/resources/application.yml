spring:
  application:
    name: demo-sb-temporal-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/demo-sb
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  temporal:
    test-server:
      enabled: true
    workersAutoDiscovery:
      packages: com.idanshal.demos
